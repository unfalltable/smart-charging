name: verify

on:
  push:
    branches: [main, "rewrite/**"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  windows-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows PowerShell 5.1 scripts
        shell: powershell
        run: ./ops/tests/local-scripts.test.ps1

  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the complete local stack
        shell: pwsh
        run: ./ops/start-local.ps1
      - name: Run two charging and payment cycles
        shell: pwsh
        run: |
          ./ops/demo-charge.ps1
          ./ops/demo-charge.ps1
          $web = Invoke-WebRequest http://127.0.0.1:8088
          if ($web.StatusCode -ne 200) { throw 'Admin web is unavailable' }
          $headers = @{ 'X-Tenant-Id' = '11111111-1111-1111-1111-111111111111' }
          Invoke-RestMethod http://127.0.0.1:8088/api/v1/admin/assets/devices -Headers $headers
      - name: Container diagnostics
        if: always()
        run: docker compose --env-file .env.docker -f ops/compose.local.yaml logs --no-color --tail 150
      - name: Stop isolated CI stack
        if: always()
        run: docker compose --env-file .env.docker -f ops/compose.local.yaml down --volumes

  vulnerability-scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0
    with:
      scan-args: |-
        --recursive
        ./

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress clean verify
      - run: mvn --batch-mode --no-transfer-progress org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputFormat=json
      - uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: target/bom.json

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run build:web
      - run: npm run check:weapp
      - run: npm sbom --sbom-format cyclonedx > frontend.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-sbom
          path: frontend.cdx.json
