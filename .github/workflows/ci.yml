name: verify

on:
  push:
    branches: [main, "rewrite/**"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  windows-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows PowerShell 5.1 scripts
        shell: powershell
        run: |
          ./ops/tests/local-scripts.test.ps1
          ./ops/tests/backup-safety.test.ps1

  vulnerability-scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0
    with:
      scan-args: |-
        --recursive
        ./

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REQUIRE_DATABASE_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress clean verify
      - run: mvn --batch-mode --no-transfer-progress org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputFormat=json
      - name: Audit resolved backend dependencies
        shell: pwsh
        run: ./ops/tests/dependency-audit.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: target/bom.json

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run test --workspaces --if-present
      - run: npm run build:web
      - run: npm run check:weapp
      - run: npm sbom --sbom-format cyclonedx > frontend.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-sbom
          path: frontend.cdx.json

  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify the deployable Docker stack
        shell: pwsh
        run: ./ops/tests/container-smoke.test.ps1
      - name: Container diagnostics
        if: failure()
        run: APP_BUILD_REVISION=ci-diagnostics docker compose --env-file .env --file ops/compose.local.yaml ps --all
      - name: Stop ephemeral CI deployment
        if: always()
        shell: pwsh
        run: |
          if (Test-Path .env) { ./ops/stop-local.ps1 -DeleteData }
