apiVersion: v1
kind: Namespace
metadata:
  name: smart-charging
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-core
  namespace: smart-charging
spec:
  replicas: 2
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: platform-core}
  template:
    metadata:
      labels: {app: platform-core}
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: core
          image: ghcr.io/unfalltable/smart-charging-core:VERSION
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: smart-charging-runtime}
            - secretRef: {name: smart-charging-secrets}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests: {cpu: 300m, memory: 512Mi}
            limits: {cpu: "2", memory: 1536Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: wechat-pay-files, mountPath: /run/secrets/wechat-pay, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: wechat-pay-files
          secret: {secretName: wechat-pay-files}
---
apiVersion: v1
kind: Service
metadata:
  name: platform-core
  namespace: smart-charging
spec:
  selector: {app: platform-core}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-gateway
  namespace: smart-charging
spec:
  replicas: 2
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: device-gateway}
  template:
    metadata:
      labels: {app: device-gateway}
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: gateway
          image: ghcr.io/unfalltable/smart-charging-device-gateway:VERSION
          imagePullPolicy: IfNotPresent
          ports:
            - {name: device, containerPort: 9000}
            - {name: management, containerPort: 9001}
          envFrom:
            - configMapRef: {name: smart-charging-runtime}
            - secretRef: {name: smart-charging-secrets}
          env:
            - {name: DEVICE_CREDENTIAL_PROVIDER, value: redis}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: management}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 300m, memory: 384Mi}
            limits: {cpu: "2", memory: 1024Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: device-tls, mountPath: /run/secrets/device-tls, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: device-tls
          secret: {secretName: device-gateway-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: device-gateway
  namespace: smart-charging
spec:
  type: LoadBalancer
  selector: {app: device-gateway}
  ports:
    - {name: device, port: 9000, targetPort: device}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: platform-core
  namespace: smart-charging
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: platform-core}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: device-gateway
  namespace: smart-charging
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: device-gateway}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: platform-core
  namespace: smart-charging
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: platform-core}
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: device-gateway
  namespace: smart-charging
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: device-gateway}
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
