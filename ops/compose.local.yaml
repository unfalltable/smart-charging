name: smart-charging-local

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: charging
      POSTGRES_USER: charging_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init-keycloak.sh:/docker-entrypoint-initdb.d/20-keycloak.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charging_app -d charging"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 768m

  valkey:
    image: valkey/valkey:9-alpine
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
    command:
      [
        "valkey-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}",
      ]
    ports:
      - "127.0.0.1:${VALKEY_PORT:-16379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "VALKEYCLI_AUTH=$${VALKEY_PASSWORD} valkey-cli ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 256m

  nats:
    image: nats:2.12-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "127.0.0.1:${NATS_PORT:-14222}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-18222}:8222"
    volumes:
      - nats-data:/data
    restart: unless-stopped
    mem_limit: 256m

  keycloak:
    profiles: ["bundled-identity"]
    build:
      context: ..
      dockerfile: ops/keycloak.Dockerfile
      args:
        KEYCLOAK_IMAGE: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.7.4}
    command:
      - start
      - --optimized
      - --import-realm
      - --http-enabled=true
      - --server-async-bootstrap=false
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak_app
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD is required}
      KC_HOSTNAME: http://127.0.0.1:${KEYCLOAK_PORT:-19090}
      KC_HTTP_PORT: ${KEYCLOAK_PORT:-19090}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=65
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-19090}:${KEYCLOAK_PORT:-19090}"
    volumes:
      - ${KEYCLOAK_IMPORT_DIRECTORY:-../runtime-secrets/keycloak}:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-database-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep -q 'HTTP/1.[01] 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 18
    restart: unless-stopped
    mem_limit: 1024m

  keycloak-database-init:
    profiles: ["bundled-identity"]
    image: postgres:18-alpine
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: charging
      POSTGRES_USER: charging_app
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
    volumes:
      - ./postgres-init-keycloak.sh:/usr/local/bin/init-keycloak-database.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/init-keycloak-database.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 128m

  core:
    build:
      context: ..
      dockerfile: ops/core.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: production
      DATABASE_URL: jdbc:postgresql://postgres:5432/charging
      DATABASE_USER: charging_app
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_POOL_MIN_IDLE: ${DATABASE_POOL_MIN_IDLE:-2}
      NATS_URL: nats://nats:4222
      VALKEY_HOST: valkey
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
      VALKEY_TLS_ENABLED: "false"
      DEVICE_CREDENTIAL_MASTER_KEY_BASE64: ${DEVICE_CREDENTIAL_MASTER_KEY_BASE64:?DEVICE_CREDENTIAL_MASTER_KEY_BASE64 is required}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET:?QR_SIGNING_SECRET is required}
      AUTH_JWT_SECRET_BASE64: ${AUTH_JWT_SECRET_BASE64:?AUTH_JWT_SECRET_BASE64 is required}
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-}
      OIDC_JWK_SET_URI: ${OIDC_JWK_SET_URI:-}
      API_JWT_AUDIENCE: ${API_JWT_AUDIENCE:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      WECHAT_IDENTITY_ENABLED: ${WECHAT_IDENTITY_ENABLED:-false}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_TENANT_CODE: ${WECHAT_TENANT_CODE:-}
      WECHAT_NOTIFICATION_ENABLED: ${WECHAT_NOTIFICATION_ENABLED:-false}
      WECHAT_NOTIFICATION_TEMPLATES_JSON: ${WECHAT_NOTIFICATION_TEMPLATES_JSON:-{}}
      WECHAT_PRIMARY_PRIVATE_KEY_PATH: /run/secrets/wechat-pay/merchant-private-key.pem
      WECHAT_PRIMARY_MERCHANT_SERIAL: ${WECHAT_PRIMARY_MERCHANT_SERIAL:-}
      WECHAT_PRIMARY_API_V3_KEY: ${WECHAT_PRIMARY_API_V3_KEY:-}
      WECHAT_PRIMARY_PUBLIC_KEY_PATH: /run/secrets/wechat-pay/wechat-pay-public-key.pem
      WECHAT_PRIMARY_PUBLIC_KEY_ID: ${WECHAT_PRIMARY_PUBLIC_KEY_ID:-}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      RATE_LIMIT_DEFAULT_PER_MINUTE: ${RATE_LIMIT_DEFAULT_PER_MINUTE:-600}
      RATE_LIMIT_PUBLIC_PER_MINUTE: ${RATE_LIMIT_PUBLIC_PER_MINUTE:-120}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-20}
      TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE:-0.1}
      OUTBOX_PUBLISHER_DELAY_MS: ${OUTBOX_PUBLISHER_DELAY_MS:-500}
      APPLICATION_LOG_LEVEL: ${APPLICATION_LOG_LEVEL:-INFO}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    ports:
      - "127.0.0.1:${CORE_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      valkey:
        condition: service_healthy
      keycloak:
        condition: service_healthy
        required: false
    restart: unless-stopped
    mem_limit: 1024m
    volumes:
      - ${WECHAT_PAYMENT_DIRECTORY:-../runtime-secrets/wechat-pay}:/run/secrets/wechat-pay:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m

  admin-web:
    build:
      context: ..
      dockerfile: ops/admin-web.Dockerfile
      args:
        VITE_API_BASE: /api/v1
        VITE_OIDC_AUTHORIZATION_ENDPOINT: ${VITE_OIDC_AUTHORIZATION_ENDPOINT:-}
        VITE_OIDC_TOKEN_ENDPOINT: ${VITE_OIDC_TOKEN_ENDPOINT:-}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
        VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-}
        VITE_OIDC_SCOPES: ${VITE_OIDC_SCOPES:-openid}
    ports:
      - "127.0.0.1:${ADMIN_WEB_PORT:-8088}:8080"
    depends_on:
      core:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m

  device-gateway:
    profiles: ["device"]
    build:
      context: ..
      dockerfile: ops/device-gateway.Dockerfile
    environment:
      DEVICE_TLS_ENABLED: "true"
      DEVICE_TLS_CERTIFICATE: /run/secrets/device-tls/tls.crt
      DEVICE_TLS_PRIVATE_KEY: /run/secrets/device-tls/tls.key
      DEVICE_TLS_TRUST_CERTIFICATES: /run/secrets/device-tls/ca.crt
      DEVICE_GATEWAY_PORT: "9000"
      MANAGEMENT_PORT: "9001"
      DEVICE_CREDENTIAL_PROVIDER: redis
      DEVICE_CREDENTIAL_MASTER_KEY_BASE64: ${DEVICE_CREDENTIAL_MASTER_KEY_BASE64:?DEVICE_CREDENTIAL_MASTER_KEY_BASE64 is required}
      VALKEY_HOST: valkey
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
      NATS_URL: nats://nats:4222
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    ports:
      - "${DEVICE_GATEWAY_BIND_ADDRESS:-127.0.0.1}:${DEVICE_GATEWAY_PORT:-9000}:9000"
      - "127.0.0.1:${DEVICE_MANAGEMENT_PORT:-9001}:9001"
    volumes:
      - ${DEVICE_TLS_DIRECTORY:-./certs/device}:/run/secrets/device-tls:ro
    depends_on:
      valkey:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp:size=32m

volumes:
  postgres-data:
  valkey-data:
  nats-data:
