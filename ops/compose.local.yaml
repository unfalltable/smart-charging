name: smart-charging-local

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  snapshot-tool:
    profiles: ["maintenance"]
    image: smart-charging-local-snapshot-tool:latest
    build:
      context: .
      dockerfile: snapshot.Dockerfile
    network_mode: none
    read_only: true
    command: ["--help"]
    mem_limit: 64m
    logging: *default-logging

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: charging
      POSTGRES_USER: charging_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charging_app -d charging"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 768m
    logging: *default-logging

  database-bootstrap:
    image: postgres:18-alpine
    user: postgres
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_MIGRATION_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:?DATABASE_MIGRATION_PASSWORD is required}
      DATABASE_RUNTIME_PASSWORD: ${DATABASE_RUNTIME_PASSWORD:?DATABASE_RUNTIME_PASSWORD is required}
    entrypoint: ["psql", "--host=postgres", "--username=charging_app", "--dbname=charging", "--file=/bootstrap/database-bootstrap.sql"]
    volumes:
      - ./database-bootstrap.sql:/bootstrap/database-bootstrap.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  valkey:
    image: valkey/valkey:9-alpine
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
    command:
      [
        "valkey-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}",
      ]
    ports:
      - "127.0.0.1:${VALKEY_PORT:-16379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "VALKEYCLI_AUTH=$${VALKEY_PASSWORD} valkey-cli ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging

  nats:
    image: nats:2.12-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222", "--auth", "${NATS_TOKEN:?NATS_TOKEN is required}"]
    ports:
      - "127.0.0.1:${NATS_PORT:-14222}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-18222}:8222"
    volumes:
      - nats-data:/data
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  core:
    env_file:
      - ${CORE_MERCHANT_ENV_FILE:-../runtime-secrets/core-merchant.env}
    build:
      context: ..
      dockerfile: ops/core.Dockerfile
      args:
        APP_BUILD_REVISION: ${APP_BUILD_REVISION:?APP_BUILD_REVISION is required}
    environment:
      APP_BUILD_REVISION: ${APP_BUILD_REVISION:?APP_BUILD_REVISION is required}
      SPRING_PROFILES_ACTIVE: production
      DATABASE_URL: jdbc:postgresql://postgres:5432/charging
      DATABASE_USER: charging_runtime
      DATABASE_PASSWORD: ${DATABASE_RUNTIME_PASSWORD:?DATABASE_RUNTIME_PASSWORD is required}
      DATABASE_MIGRATION_URL: jdbc:postgresql://postgres:5432/charging
      DATABASE_MIGRATION_USER: charging_migrator
      DATABASE_MIGRATION_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:?DATABASE_MIGRATION_PASSWORD is required}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_POOL_MIN_IDLE: ${DATABASE_POOL_MIN_IDLE:-2}
      NATS_URL: nats://nats:4222
      NATS_TOKEN: ${NATS_TOKEN:?NATS_TOKEN is required}
      VALKEY_HOST: valkey
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
      VALKEY_TLS_ENABLED: "false"
      DEVICE_CREDENTIAL_MASTER_KEY_BASE64: ${DEVICE_CREDENTIAL_MASTER_KEY_BASE64:?DEVICE_CREDENTIAL_MASTER_KEY_BASE64 is required}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET:?QR_SIGNING_SECRET is required}
      AUTH_JWT_SECRET_BASE64: ${AUTH_JWT_SECRET_BASE64:?AUTH_JWT_SECRET_BASE64 is required}
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-}
      API_JWT_AUDIENCE: ${API_JWT_AUDIENCE:-}
      IDENTITY_LOGIN_EVENT_RETENTION_DAYS: ${IDENTITY_LOGIN_EVENT_RETENTION_DAYS:-180}
      IDENTITY_EXPIRED_TOKEN_RETENTION_DAYS: ${IDENTITY_EXPIRED_TOKEN_RETENTION_DAYS:-7}
      PLATFORM_ADMIN_SUBJECT: ${PLATFORM_ADMIN_SUBJECT:-}
      PLATFORM_ADMIN_USERNAME: ${PLATFORM_ADMIN_USERNAME:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      PLATFORM_ADMIN_DISPLAY_NAME: ${PLATFORM_ADMIN_DISPLAY_NAME:-Platform Administrator}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      WECHAT_IDENTITY_ENABLED: ${WECHAT_IDENTITY_ENABLED:-false}
      WECHAT_PAYMENT_ENABLED: ${WECHAT_PAYMENT_ENABLED:-false}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_TENANT_CODE: ${WECHAT_TENANT_CODE:-}
      WECHAT_NOTIFICATION_ENABLED: ${WECHAT_NOTIFICATION_ENABLED:-false}
      WECHAT_NOTIFICATION_TEMPLATES_JSON: ${WECHAT_NOTIFICATION_TEMPLATES_JSON:-{}}
      WECHAT_PRIMARY_PRIVATE_KEY_PATH: /run/secrets/wechat-pay/merchant-private-key.pem
      WECHAT_PRIMARY_MERCHANT_SERIAL: ${WECHAT_PRIMARY_MERCHANT_SERIAL:-}
      WECHAT_PRIMARY_API_V3_KEY: ${WECHAT_PRIMARY_API_V3_KEY:-}
      WECHAT_PRIMARY_PUBLIC_KEY_PATH: /run/secrets/wechat-pay/wechat-pay-public-key.pem
      WECHAT_PRIMARY_PUBLIC_KEY_ID: ${WECHAT_PRIMARY_PUBLIC_KEY_ID:-}
      PAYMENT_PROFIT_SHARING_MAX_BASIS_POINTS: ${PAYMENT_PROFIT_SHARING_MAX_BASIS_POINTS:-3000}
      PAYMENT_INTENT_EXPIRE_MINUTES: ${PAYMENT_INTENT_EXPIRE_MINUTES:-30}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      RATE_LIMIT_DEFAULT_PER_MINUTE: ${RATE_LIMIT_DEFAULT_PER_MINUTE:-600}
      RATE_LIMIT_PUBLIC_PER_MINUTE: ${RATE_LIMIT_PUBLIC_PER_MINUTE:-120}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-20}
      TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE:-0.1}
      OUTBOX_PUBLISHER_DELAY_MS: ${OUTBOX_PUBLISHER_DELAY_MS:-500}
      APPLICATION_LOG_LEVEL: ${APPLICATION_LOG_LEVEL:-INFO}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    ports:
      - "127.0.0.1:${CORE_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      database-bootstrap:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1024m
    volumes:
      - ${WECHAT_PAYMENT_DIRECTORY:-../runtime-secrets/wechat-pay}:/run/secrets/wechat-pay:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  admin-web:
    build:
      context: ..
      dockerfile: ops/admin-web.Dockerfile
      args:
        APP_BUILD_REVISION: ${APP_BUILD_REVISION:?APP_BUILD_REVISION is required}
        VITE_API_BASE: /api/v1
    ports:
      - "127.0.0.1:${ADMIN_WEB_PORT:-8088}:8080"
    depends_on:
      core:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  public-edge:
    profiles: ["production"]
    image: caddy:2-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      admin-web:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  device-gateway:
    profiles: ["device"]
    build:
      context: ..
      dockerfile: ops/device-gateway.Dockerfile
    environment:
      DEVICE_TLS_ENABLED: "true"
      DEVICE_TLS_CERTIFICATE: /run/secrets/device-tls/tls.crt
      DEVICE_TLS_PRIVATE_KEY: /run/secrets/device-tls/tls.key
      DEVICE_TLS_TRUST_CERTIFICATES: /run/secrets/device-tls/ca.crt
      DEVICE_GATEWAY_PORT: "9000"
      MANAGEMENT_PORT: "9001"
      DEVICE_CREDENTIAL_PROVIDER: redis
      DEVICE_CREDENTIAL_MASTER_KEY_BASE64: ${DEVICE_CREDENTIAL_MASTER_KEY_BASE64:?DEVICE_CREDENTIAL_MASTER_KEY_BASE64 is required}
      VALKEY_HOST: valkey
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
      NATS_URL: nats://nats:4222
      NATS_TOKEN: ${NATS_TOKEN:?NATS_TOKEN is required}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    ports:
      - "${DEVICE_GATEWAY_BIND_ADDRESS:-127.0.0.1}:${DEVICE_GATEWAY_PORT:-9000}:9000"
      - "127.0.0.1:${DEVICE_MANAGEMENT_PORT:-9001}:9001"
    volumes:
      - ${DEVICE_TLS_DIRECTORY:-./certs/device}:/run/secrets/device-tls:ro
    depends_on:
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

volumes:
  postgres-data:
  valkey-data:
  nats-data:
  caddy-data:
  caddy-config:
