spring:
  application:
    name: smart-charging-core
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:20}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:2}
      connection-timeout: 3000
  flyway:
    enabled: true
    url: ${DATABASE_MIGRATION_URL:${DATABASE_URL}}
    user: ${DATABASE_MIGRATION_USER:${DATABASE_USER}}
    password: ${DATABASE_MIGRATION_PASSWORD:${DATABASE_PASSWORD}}
    validate-migration-naming: true
  task:
    scheduling:
      pool:
        size: 4
  data:
    redis:
      host: ${VALKEY_HOST}
      port: ${VALKEY_PORT:6379}
      password: ${VALKEY_PASSWORD}
      timeout: 2s
      ssl:
        enabled: ${VALKEY_TLS_ENABLED:true}
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB
info:
  build:
    revision: ${APP_BUILD_REVISION:unknown}
charging:
  qr-signing-secret: ${QR_SIGNING_SECRET}
  payment:
    intent-expire-minutes: ${PAYMENT_INTENT_EXPIRE_MINUTES:30}
    profit-sharing:
      maximum-basis-points: ${PAYMENT_PROFIT_SHARING_MAX_BASIS_POINTS:3000}
  security:
    app-issuer: ${APP_JWT_ISSUER}
    app-jwt-secret-base64: ${AUTH_JWT_SECRET_BASE64}
    api-audience: ${API_JWT_AUDIENCE:smart-charging-api}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
  identity:
    local:
      subject: ${PLATFORM_ADMIN_SUBJECT:}
      username: ${PLATFORM_ADMIN_USERNAME:}
      password: ${PLATFORM_ADMIN_PASSWORD:}
      display-name: ${PLATFORM_ADMIN_DISPLAY_NAME:Platform Administrator}
      email: ${PLATFORM_ADMIN_EMAIL:}
    admin:
      login-event-retention-days: ${IDENTITY_LOGIN_EVENT_RETENTION_DAYS:180}
      expired-token-retention-days: ${IDENTITY_EXPIRED_TOKEN_RETENTION_DAYS:7}
    wechat:
      enabled: ${WECHAT_IDENTITY_ENABLED:false}
      app-id: ${WECHAT_APP_ID:}
      app-secret: ${WECHAT_APP_SECRET:}
      tenant-code: ${WECHAT_TENANT_CODE:}
  notification:
    wechat:
      enabled: ${WECHAT_NOTIFICATION_ENABLED:false}
      templates-json: ${WECHAT_NOTIFICATION_TEMPLATES_JSON:{}}
  web:
    allowed-origins: ${ALLOWED_ORIGINS}
  rate-limit:
    default-per-minute: ${RATE_LIMIT_DEFAULT_PER_MINUTE:600}
    public-per-minute: ${RATE_LIMIT_PUBLIC_PER_MINUTE:120}
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:20}
  device-credentials:
    master-key-base64: ${DEVICE_CREDENTIAL_MASTER_KEY_BASE64:}
nats:
  url: ${NATS_URL}
  token: ${NATS_TOKEN:}
outbox:
  publisher-delay-ms: ${OUTBOX_PUBLISHER_DELAY_MS:250}
payments:
  wechat-enabled: ${WECHAT_PAYMENT_ENABLED:false}
management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    info:
      access: read-only
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
logging:
  level:
    io.smartcharge.platform: ${APPLICATION_LOG_LEVEL:INFO}
